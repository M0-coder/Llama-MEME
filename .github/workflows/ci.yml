name: Llama CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: llama-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install exact direct dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Static analysis and TypeScript compilation
        run: npm run lint

      - name: Validate canonical specifications and dependency pins
        run: npm run validate

      - name: Unit and integration tests
        run: npm test

      - name: Coverage evidence
        run: npm run coverage

      - name: Secret-pattern security check
        run: npm run security

      - name: Dependency tree evidence
        run: npm ls --all
